<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#374151" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="430" fill="#f8fafc" />

  <text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">
    LSH-MinHash Pipeline: Where Assumptions Hold vs Break
  </text>

  <rect x="40" y="100" width="250" height="110" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Stage 1</text>
  <text x="60" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#1f2937">Signature generation</text>
  <text x="60" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#2563eb">Assumption holds</text>

  <rect x="335" y="100" width="250" height="110" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="355" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#065f46">Stage 2</text>
  <text x="355" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#1f2937">Band bucketing</text>
  <text x="355" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#059669">Assumption holds</text>

  <rect x="630" y="100" width="250" height="110" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="650" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">Stage 3</text>
  <text x="650" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#1f2937">Clustering</text>
  <text x="650" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#b91c1c">Legacy transitive union breaks</text>

  <rect x="925" y="100" width="235" height="110" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="945" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#312e81">Stage 4</text>
  <text x="945" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#1f2937">Filtering/output</text>
  <text x="945" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4338ca">Depends on Stage 3</text>

  <line x1="292" y1="155" x2="330" y2="155" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="587" y1="155" x2="625" y2="155" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="882" y1="155" x2="920" y2="155" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="250" width="1120" height="130" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">
    Broken invariant under legacy unionization
  </text>
  <text x="60" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1f2937">
    LSH guarantees local bucket evidence: if two docs collide in a bucket, they are candidate duplicates.
  </text>
  <text x="60" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1f2937">
    It does NOT imply transitivity across overlap chains. Transitive bucket unionization adds extra constraints
  </text>
  <text x="60" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1f2937">
    not entailed by emitted buckets; that is why Stage 3 must use bucket-local feasibility.
  </text>
</svg>
